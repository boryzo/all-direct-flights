name: flightsfrom - polish airports to CSV

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 */7 * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Scrape airports -> CSV
        env:
          AIRPORTS: "GDN,LCJ,BZG,WAW,IEG,WMI,SZY,RDO,KRK,KTW,LUZ,WRO,POZ,SZZ,RZE"  # dostosuj listę
        run: |
          rm -rf out
          IFS=',' read -r -a airport_list <<< "${AIRPORTS}"
          pids=()
          for ((i=0; i<${#airport_list[@]}; i+=3)); do
            batch="$(IFS=','; echo "${airport_list[*]:i:3}")"
            python scripts/flightsfrom_scrape.py --airports "${batch}" --out-dir out &
            pids+=($!)
            if [ "${#pids[@]}" -ge 3 ]; then
              wait -n
              pids=($(jobs -p))
            fi
          done
          wait
          ls -la out

      - name: Ensure csv-latest release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view csv-latest >/dev/null 2>&1; then
            gh release create csv-latest --title "CSV Latest" --notes "Daily direct-flight CSV" --target "${GITHUB_SHA}"
          fi

      - name: Publish CSVs as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in out/*.csv; do
            gh release upload csv-latest "$file" --clobber
          done
